volumes:
  pdf-extractor-models:
    name: pdf-extractor-models

services:
  pdf-extractor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_VARIANT: cpu
    image: dzuladj/pdf-extractor:cpu-dev
    ports:
      - "8501:8501"
    volumes:
      - pdf-extractor-models:/app/app/models

  pdf-extractor-gpu:
    profiles: [gpu]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_VARIANT: gpu
    image: dzuladj/pdf-extractor:gpu-dev
    gpus: all
    ports:
      - "8502:8501"
    volumes:
      - pdf-extractor-models:/app/app/models
