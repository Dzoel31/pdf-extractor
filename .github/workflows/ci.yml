name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lockfile:
    name: Validate uv lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv lock --check
      - name: Audit locked Python dependencies
        run: uv audit --locked --no-dev

  docker:
    name: Build ${{ matrix.variant }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: TORCH_VARIANT=${{ matrix.variant }}
          cache-from: type=gha,scope=pdf-extractor-${{ matrix.variant }}
          cache-to: type=gha,scope=pdf-extractor-${{ matrix.variant }},mode=max
