[project]
name = "pdf-extractor"
version = "0.1.0"
description = "Streamlit tool for PDF extraction, OCR, and audio/video transcription."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "accelerate",
    "azure-ai-documentintelligence",
    "docling",
    "easyocr",
    "langchain-core",
    "langchain-community",
    "langchain-google-genai",
    "numpy",
    "openai-whisper",
    "opencv-python-headless",
    "openpyxl",
    "pandas",
    "pillow>=12.3.0",
    "pydantic-settings",
    "pydub",
    "pymupdf",
    "pypdf",
    "pytesseract",
    "python-dotenv",
    "requests",
    "streamlit",
    "streamlit-pdf-viewer",
    "torch",
    "torchvision",
    "ultralytics",
    "numba>=0.66.0",
]

[project.optional-dependencies]
windows = [
    "pywin32; sys_platform == 'win32'",
]
